name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the dock exe
        shell: pwsh
        run: .\Scripts\Dock\Build-WinGodDockExe.ps1

      - name: Run the test suite
        shell: pwsh
        run: .\Scripts\Run-Tests.ps1 -Bootstrap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winGod-dock
          path: |
            build\winGod-dock.exe
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build\winGod-dock.exe
            Scripts\Dock\Install-WinGodDock.ps1
